<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Awakened — Book One</title>

  <meta
    name="description"
    content="The Awakened — Book One: Before the Beginning"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at center, #252525 0%, #0b0b0b 70%);
      color: #f4ead3;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 60px 25px;
    }

    .symbol {
      font-size: 52px;
      margin-bottom: 25px;
      color: #d8b66a;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 82px);
      letter-spacing: 8px;
      font-weight: normal;
      text-transform: uppercase;
    }

    h2 {
      margin: 18px 0 45px;
      font-size: clamp(18px, 4vw, 28px);
      font-weight: normal;
      letter-spacing: 3px;
      color: #cdbb91;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: #a88a4a;
      margin: 0 auto 40px;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 45px;
      line-height: 1.8;
      font-size: 18px;
      color: #d8d0bf;
    }

    .button {
      display: inline-block;
      padding: 16px 34px;
      border: 1px solid #c5a45d;
      color: #f4ead3;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #c5a45d;
      color: #111;
    }

    footer {
      margin-top: 70px;
      font-size: 13px;
      color: #817a6d;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="symbol">✦</div>

    <h1>The Awakened</h1>

    <h2>Book One: Before the Beginning</h2>

    <div class="divider"></div>

    <p class="description">
      Before kingdoms rose, before history was written,
      and before humanity remembered where it came from,
      something ancient was waiting to awaken.
    </p>

    <a class="button" href="novel.html">
      Enter the Book
    </a>

    <footer>
      © 2026 The Awakened
    </footer>

  </main>

</body>
</html>
